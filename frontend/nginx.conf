# One origin for the app, the API and the live hub, so the session cookie works without CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Matching calls the language model inside the request (classification, ranking, a hybrid).
        proxy_read_timeout 120s;
    }

    location /hubs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A live connection stays open for as long as the page is.
        proxy_read_timeout 1h;
    }

    # Vite puts a content hash in every asset name, so an asset never changes under the same URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes: every other path is the single page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
