name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy over SSH
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/castor' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          CASTOR_IMAGE_TAG: validation
          POSTGRES_PASSWORD: validation
        run: |
          install -m 600 .env.example deploy/.env
          trap 'rm -f deploy/.env' EXIT
          docker compose -f deploy/docker-compose.prod.yml config --quiet

      - name: Build application images
        run: |
          docker build --pull --tag "castor-backend:${GITHUB_SHA}" backend
          docker build --pull --tag "castor-frontend:${GITHUB_SHA}" --file frontend/Dockerfile .

      - name: Create image bundle
        run: |
          mkdir -p dist
          docker save --output dist/castor-images.tar \
            "castor-backend:${GITHUB_SHA}" \
            "castor-frontend:${GITHUB_SHA}"
          gzip --fast dist/castor-images.tar

      - name: Configure SSH
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS secret}"
          case "${DEPLOY_PATH}" in
            /*) ;;
            *) echo "DEPLOY_PATH must be absolute" >&2; exit 1 ;;
          esac
          case "${DEPLOY_PATH}" in
            *[!A-Za-z0-9_./-]*) echo "DEPLOY_PATH contains unsupported characters" >&2; exit 1 ;;
          esac
          install -m 700 -d "${HOME}/.ssh"
          key_file="${HOME}/.ssh/deploy_key"
          umask 077
          if ! printf '%s' "${DEPLOY_SSH_KEY}" | base64 --decode > "${key_file}"; then
            rm -f "${key_file}"
            echo "DEPLOY_SSH_KEY is not valid Base64" >&2
            exit 1
          fi
          chmod 600 "${key_file}"
          if ! ssh-keygen -y -f "${key_file}" >/dev/null; then
            rm -f "${key_file}"
            echo "Decoded DEPLOY_SSH_KEY is not a valid OpenSSH private key" >&2
            exit 1
          fi
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Upload deployment bundle
        run: |
          staging_dir="${DEPLOY_PATH}/incoming/${GITHUB_SHA}"
          incoming_compose="${DEPLOY_PATH}/docker-compose.${GITHUB_SHA}.yml.new"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i "${HOME}/.ssh/deploy_key" -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p -- '${staging_dir}' '${DEPLOY_PATH}'"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i "${HOME}/.ssh/deploy_key" -P "${DEPLOY_PORT}" \
            dist/castor-images.tar.gz \
            deploy/remote-deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${staging_dir}/"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i "${HOME}/.ssh/deploy_key" -P "${DEPLOY_PORT}" \
            deploy/docker-compose.prod.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${incoming_compose}"

      - name: Activate release
        run: |
          staging_dir="${DEPLOY_PATH}/incoming/${GITHUB_SHA}"
          incoming_compose="${DEPLOY_PATH}/docker-compose.${GITHUB_SHA}.yml.new"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i "${HOME}/.ssh/deploy_key" -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash '${staging_dir}/remote-deploy.sh' '${DEPLOY_PATH}' '${GITHUB_SHA}' '${staging_dir}/castor-images.tar.gz' '${incoming_compose}'"

      - name: Remove temporary SSH key
        if: always()
        run: rm -f "${HOME}/.ssh/deploy_key"
